<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Ticker Synchronized Canvas2D Vector Field</title>
  <style>
    :root {
      --bg: oklch(0.1 0.02 260);
      --fg: oklch(0.9 0.05 260);
      --primary: oklch(0.7 0.15 260);
      --secondary: oklch(0.6 0.1 200);
      --font-display: "Chakra Petch", sans-serif;
      --font-body: "Atkinson Hyperlegible", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      min-width: 0;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2rem;
      z-index: 10;
      position: relative;
    }

    h1 {
      font-family: var(--font-display);
      margin: 0;
      font-size: 2rem;
    }

    p {
      max-width: 60ch;
      margin-top: 1rem;
    }

    .canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: relative;
      z-index: 10;
      margin-top: auto;
      padding: 2rem;
      display: flex;
      gap: 1rem;
    }

    button {
      background-color: var(--primary);
      color: var(--bg);
      border: none;
      padding: 0 1rem;
      min-height: 44px;
      font-family: var(--font-mono);
      font-weight: bold;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }

    button:focus-visible {
      outline: 2px solid var(--secondary);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      /* Handled by JS */
    }
  </style>
</head>
<body>
  <div class="canvas-container" id="stage">
    <canvas></canvas>
  </div>

  <header>
    <h1>Vector Field Sync</h1>
    <p>A performant particle field utilizing Canvas2D and synchronized strictly to GSAP's ticker, bypassing CSS animation and interval logic entirely for optimized spatial rendering.</p>
  </header>

  <div class="controls">
    <button type="button" aria-label="Toggle field dynamics">Toggle Dynamics</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        const canvasContainer = document.getElementById('stage');
        const canvas = canvasContainer.querySelector('canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const particles = [];
        const numParticles = 200;

        for(let i=0; i<numParticles; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                radius: Math.random() * 2 + 1
            });
        }

        const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        const render = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(230, 240, 255, 0.6)';

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        };

        const mm = gsap.matchMedia();
        let isReducedMotion = false;

        mm.add("(prefers-reduced-motion: reduce)", () => {
            isReducedMotion = true;
            render();
            return () => { isReducedMotion = false; }
        });

        mm.add("(prefers-reduced-motion: no-preference)", () => {
            const update = () => {
                if (!isReducedMotion) {
                    render();
                }
            };

            gsap.ticker.add(update);
            return () => {
                gsap.ticker.remove(update);
            }
        });
    });
  </script>
</body>
</html>
