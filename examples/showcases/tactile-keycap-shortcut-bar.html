<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Keycap Shortcut Legend & Chord Bar Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Rajdhani:wght@500&family=Work+Sans&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Work Sans", sans-serif;
            background-color: oklch(0.1 0.02 250);
            color: oklch(0.95 0.01 250);
            min-height: 100dvh;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .tactile-keycap-shortcut-bar {
            --bg: oklch(0.15 0.02 250);
            --surface: oklch(0.25 0.02 250);
            --border: oklch(0.35 0.02 250);
            --shadow: oklch(0.10 0.02 250);
            --text-primary: oklch(0.95 0.01 250);
            --text-secondary: oklch(0.75 0.01 250);

            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 24px;
            background: var(--bg);
            border-radius: 12px;
            font-family: "Work Sans", sans-serif;
            color: var(--text-primary);
        }

        .tactile-keycap-chord {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tactile-keycap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            padding: 0 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "JetBrains Mono", monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            box-shadow: 0 4px 0 var(--shadow);
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            font-variant-numeric: tabular-nums;
        }

        .tactile-keycap-label {
            font-family: "Rajdhani", sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            .tactile-keycap {
                transition: none;
                box-shadow: none;
                border-color: oklch(0.45 0.02 250);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tactile-keycap-shortcut-bar" id="shortcut-bar">
            <div class="tactile-keycap-chord">
                <span class="tactile-keycap" tabindex="0" role="button">Ctrl</span>
                <span>+</span>
                <span class="tactile-keycap" tabindex="0" role="button">K</span>
                <span class="tactile-keycap-label">Search</span>
            </div>
            <div class="tactile-keycap-chord">
                <span class="tactile-keycap" tabindex="0" role="button">Shift</span>
                <span>+</span>
                <span class="tactile-keycap" tabindex="0" role="button">?</span>
                <span class="tactile-keycap-label">Help</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script type="module">
        gsap.registerPlugin();

        function initTactileKeycapShortcutBar(element) {
            const ctx = gsap.context(() => {
                const mm = gsap.matchMedia();

                mm.add("(prefers-reduced-motion: no-preference)", () => {
                    const keycaps = gsap.utils.toArray('.tactile-keycap');
                    const cleanups = [];

                    keycaps.forEach(keycap => {
                        const press = () => {
                            gsap.to(keycap, { y: 4, boxShadow: '0 0px 0 var(--shadow)', duration: 0.1, ease: 'power2.out' });
                        };

                        const release = () => {
                            gsap.to(keycap, { y: 0, boxShadow: '0 4px 0 var(--shadow)', duration: 0.2, ease: 'power2.out' });
                        };

                        const keydown = (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                press();
                            }
                        };

                        const keyup = (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                release();
                            }
                        };

                        keycap.addEventListener('pointerdown', press);
                        keycap.addEventListener('pointerup', release);
                        keycap.addEventListener('pointerleave', release);
                        keycap.addEventListener('keydown', keydown);
                        keycap.addEventListener('keyup', keyup);

                        cleanups.push(() => {
                            keycap.removeEventListener('pointerdown', press);
                            keycap.removeEventListener('pointerup', release);
                            keycap.removeEventListener('pointerleave', release);
                            keycap.removeEventListener('keydown', keydown);
                            keycap.removeEventListener('keyup', keyup);
                        });
                    });

                    return () => {
                        cleanups.forEach(fn => fn());
                    };
                });
            }, element);

            return () => ctx.revert();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTactileKeycapShortcutBar(document.getElementById('shortcut-bar'));
        });
    </script>
</body>
</html>
