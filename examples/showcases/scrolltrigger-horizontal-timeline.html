<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP ScrollTrigger ContainerAnimation Archival Chronology</title>
  <style>
    :root {
      --ng-bg: oklch(0.96 0.01 85);
      --ng-fg: oklch(0.20 0.02 260);
      --ng-accent: oklch(0.60 0.15 30);
      --ng-font-display: 'Shippori Mincho', serif;
      --ng-font-body: 'Source Serif 4', serif;
      --ng-font-mono: 'IBM Plex Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background-color: var(--ng-bg);
      color: var(--ng-fg);
      font-family: var(--ng-font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .intro-header {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .intro-header h1 {
      font-family: var(--ng-font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      margin: 0;
      line-height: 1.1;
    }

    .timeline-container {
      overflow-x: hidden;
      position: relative;
      width: 100%;
    }

    .timeline-track {
      display: flex;
      width: max-content;
      min-width: 0;
    }

    .timeline-panel {
      width: 100dvw;
      min-width: 0;
      min-height: 100dvh;
      flex: 0 0 100dvw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      border-right: 1px solid var(--ng-fg);
    }

    .timeline-panel:last-child {
      border-right: none;
    }

    .timeline-panel h2 {
      font-family: var(--ng-font-display);
      font-size: clamp(2rem, 5vw, 4rem);
      margin: 0 0 1rem 0;
    }

    .metadata {
      font-family: var(--ng-font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 1rem;
      margin-top: 1rem;
      color: var(--ng-accent);
    }

    .timeline-item-anim {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background-color: var(--ng-fg);
      color: var(--ng-bg);
      font-family: var(--ng-font-mono);
      border: none;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
    }

    .outro-footer {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .timeline-container {
        overflow-x: auto;
      }
      .timeline-panel {
        width: 100%;
        flex: 1;
        border-right: none;
        border-bottom: 1px solid var(--ng-fg);
        min-height: auto;
      }
      .timeline-track {
        flex-direction: column;
        width: 100%;
      }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

  <header class="intro-header">
    <h1>Archival Chronology</h1>
    <p>Scroll down to enter the horizontal timeline.</p>
  </header>

  <main class="timeline-container" id="timeline">
    <div class="timeline-track">
      <div class="timeline-panel">
        <h2>Era I</h2>
        <p>The dawn of the archive.</p>
        <div class="metadata">1919-1925</div>
        <button class="timeline-item-anim">Inspect</button>
      </div>
      <div class="timeline-panel">
        <h2>Era II</h2>
        <p>The period of expansion.</p>
        <div class="metadata">1925-1932</div>
        <button class="timeline-item-anim">Inspect</button>
      </div>
      <div class="timeline-panel">
        <h2>Era III</h2>
        <p>The modern synthesis.</p>
        <div class="metadata">1932-1940</div>
        <button class="timeline-item-anim">Inspect</button>
      </div>
    </div>
  </main>

  <footer class="outro-footer">
    <h2>End of Chronology</h2>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      gsap.registerPlugin(ScrollTrigger);

      const mm = gsap.matchMedia();
      mm.add("(prefers-reduced-motion: no-preference)", () => {
        const container = document.getElementById("timeline");
        if (!container) return;

        const track = container.querySelector('.timeline-track');
        if (!track) return;

        const panels = gsap.utils.toArray(container.querySelectorAll('.timeline-panel'));
        if (panels.length === 0) return;

        const tween = gsap.to(panels, {
          xPercent: -100 * (panels.length - 1),
          ease: "none",
          scrollTrigger: {
            trigger: container,
            pin: true,
            scrub: 1,
            snap: 1 / (panels.length - 1),
            end: () => "+=" + track.offsetWidth
          }
        });

        const items = gsap.utils.toArray(container.querySelectorAll('.timeline-item-anim'));
        items.forEach((item) => {
          gsap.to(item, {
            scale: 1.1,
            ease: "none",
            scrollTrigger: {
              trigger: item,
              containerAnimation: tween,
              start: "left center",
              end: "right center",
              scrub: true
            }
          });
        });

        return () => {
          tween.kill();
        };
      });

      mm.add("(prefers-reduced-motion: reduce)", () => {
        return () => {};
      });
    });
  </script>
</body>
</html>
