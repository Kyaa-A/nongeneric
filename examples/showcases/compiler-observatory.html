<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compiler AST Observatory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: oklch(0.12 0.02 260);
      --color-surface: oklch(0.18 0.02 260);
      --color-border: oklch(0.25 0.02 260);
      --color-text-primary: oklch(0.95 0.02 260);
      --color-text-secondary: oklch(0.7 0.02 260);
      --color-accent: oklch(0.65 0.25 250);

      --font-display: "Chakra Petch", sans-serif;
      --font-body: "Work Sans", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 16px;
      min-width: 0;
    }

    .title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--color-text-primary);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      flex-grow: 1;
      min-width: 0;
    }

    .panel {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      color: var(--color-accent);
      text-transform: uppercase;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed var(--color-border);
    }

    .telemetry-label {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .telemetry-value {
      font-family: var(--font-mono);
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      color: var(--color-text-primary);
    }

    .controls {
      margin-top: auto;
      display: flex;
      gap: 16px;
    }

    .btn {
      background-color: transparent;
      border: 1px solid var(--color-accent);
      color: var(--color-accent);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
      padding: 8px 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover,
    .btn:focus-visible {
      background-color: var(--color-accent);
      color: var(--color-bg);
      outline: 2px solid var(--color-text-primary);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        /* No motion fallback */
      }
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1 class="title">AST Observatory</h1>
  </header>

  <main class="main-grid">
    <section class="panel">
      <h2 class="panel-title">Trace Nodes</h2>
      <div class="telemetry-row">
        <span class="telemetry-label">Root Node Hash</span>
        <span class="telemetry-value">0x8F92A</span>
      </div>
      <div class="telemetry-row">
        <span class="telemetry-label">Child Invocations</span>
        <span class="telemetry-value">4,096</span>
      </div>
      <div class="telemetry-row">
        <span class="telemetry-label">Parse Time (ms)</span>
        <span class="telemetry-value">12.04</span>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">Analyzer Control</h2>
      <div class="telemetry-row">
        <span class="telemetry-label">Status</span>
        <span class="telemetry-value" style="color: var(--color-accent);">IDLE</span>
      </div>
      <div class="controls">
        <button type="button" class="btn">Execute</button>
        <button type="button" class="btn" style="border-color: var(--color-text-secondary); color: var(--color-text-secondary);">Halt</button>
      </div>
    </section>
  </main>
</body>
</html>
