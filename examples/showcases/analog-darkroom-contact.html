<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silver-Gelatin Darkroom Contact Sheet</title>
  <style>
    :root {
      --bg-color: oklch(0.15 0 0);
      --surface-color: oklch(0.20 0 0);
      --border-color: oklch(0.35 0 0);
      --text-color: oklch(0.9 0 0);
      --muted-color: oklch(0.6 0 0);
      --accent-color: oklch(0.8 0 0);

      --font-display: "Playfair Display", serif;
      --font-body: "Work Sans", sans-serif;
      --font-mono: "Space Mono", monospace;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-body);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      padding: 2rem;
      box-sizing: border-box;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 1rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 3rem;
      margin: 0;
      font-weight: 700;
    }

    .metadata {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--muted-color);
      margin-top: 0.5rem;
      font-variant-numeric: tabular-nums;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .contact-frame {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      aspect-ratio: 4/3;
    }

    .frame-image {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
    }

    .frame-number {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted-color);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    button.develop-btn {
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      font-family: var(--font-mono);
      font-size: 1rem;
      cursor: pointer;
      align-self: flex-start;
      min-height: 44px;
      min-width: 44px;
    }

    button.develop-btn:hover {
      background-color: var(--surface-color);
      border-color: var(--text-color);
    }

    button.develop-btn:focus-visible {
      background-color: var(--surface-color);
      border-color: var(--text-color);
      outline: 2px solid var(--text-color);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Archival Film Contact Sheet</h1>
      <div class="metadata">Roll: 32A | ISO: 400 | Dev: D-76 (1:1) 10m | Temp: 20C</div>
    </header>

    <div class="controls">
      <button class="develop-btn" aria-label="Develop frames">PROCESS FRAMES</button>
    </div>

    <div class="grid">
      <div class="contact-frame">
        <div class="frame-image"></div>
        <div class="frame-number">01</div>
      </div>
      <div class="contact-frame">
        <div class="frame-image"></div>
        <div class="frame-number">02</div>
      </div>
      <div class="contact-frame">
        <div class="frame-image"></div>
        <div class="frame-number">03</div>
      </div>
      <div class="contact-frame">
        <div class="frame-image"></div>
        <div class="frame-number">04</div>
      </div>
      <div class="contact-frame">
        <div class="frame-image"></div>
        <div class="frame-number">05</div>
      </div>
      <div class="contact-frame">
        <div class="frame-image"></div>
        <div class="frame-number">06</div>
      </div>
      <div class="contact-frame">
        <div class="frame-image"></div>
        <div class="frame-number">07</div>
      </div>
      <div class="contact-frame">
        <div class="frame-image"></div>
        <div class="frame-number">08</div>
      </div>
    </div>
  </div>
</body>
</html>
