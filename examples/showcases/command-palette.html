<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Palette Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(0.15 0.02 250);
      --surface: oklch(0.20 0.02 250);
      --border: oklch(0.30 0.02 250);
      --text: oklch(0.90 0.02 250);
      --text-muted: oklch(0.60 0.02 250);
      --accent: oklch(0.70 0.15 250);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      min-width: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Work Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 5vw, 4rem);
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    .trigger-button {
      background-color: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 1rem;
      font-family: 'Work Sans', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .trigger-button:hover {
      background-color: var(--border);
    }

    .command-palette-backdrop {
      position: fixed;
      inset: 0;
      background-color: oklch(0% 0 0 / 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      visibility: hidden;
      opacity: 0;
    }

    .command-palette-container {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: min(100%, 600px);
      color: var(--text);
      font-family: 'Work Sans', sans-serif;
      box-shadow: 0 10px 30px oklch(0% 0 0 / 0.5);
      overflow: hidden;
      transform: scale(0.95);
    }

    .command-palette-input {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-family: 'Syne', sans-serif;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      outline: none;
    }

    .command-palette-input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .command-palette-list {
      max-height: 300px;
      overflow-y: auto;
      padding: 8px;
      margin: 0;
      list-style: none;
    }

    .command-palette-item {
      padding: 12px 16px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      box-sizing: border-box;
    }

    .command-palette-item:hover,
    .command-palette-item[aria-selected="true"] {
      background-color: var(--border);
    }

    .command-palette-shortcut {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      background-color: var(--bg);
      padding: 4px 8px;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }

    @media (prefers-reduced-motion: reduce) {
      .command-palette-container {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>

  <h1 class="hero-title">Command Palette Showcase</h1>
  <button class="trigger-button" id="trigger" aria-haspopup="dialog">Open Command Palette</button>

  <div class="command-palette-backdrop" id="backdrop" role="dialog" aria-modal="true" aria-label="Command Palette">
    <div class="command-palette-container" id="palette">
      <input class="command-palette-input" placeholder="Search commands..." autocomplete="off" spellcheck="false" aria-label="Search commands" />
      <ul class="command-palette-list" role="listbox">
        <li class="command-palette-item" role="option" aria-selected="true">
          <span>Open Settings</span>
          <span class="command-palette-shortcut">⌘ S</span>
        </li>
        <li class="command-palette-item" role="option" aria-selected="false">
          <span>Toggle Theme</span>
          <span class="command-palette-shortcut">⌘ T</span>
        </li>
        <li class="command-palette-item" role="option" aria-selected="false">
          <span>Create Document</span>
          <span class="command-palette-shortcut">⌘ N</span>
        </li>
      </ul>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const trigger = document.getElementById('trigger');
      const backdrop = document.getElementById('backdrop');
      const palette = document.getElementById('palette');
      const input = backdrop.querySelector('.command-palette-input');

      let ctx = gsap.context(() => {}, backdrop);

      function openPalette() {
        if (ctx) ctx.revert();
        ctx = gsap.context(() => {}, backdrop);
        ctx.add(() => {
          const mm = gsap.matchMedia();
          mm.add('(prefers-reduced-motion: no-preference)', () => {
            gsap.set(backdrop, { autoAlpha: 1 });
            gsap.fromTo(palette,
              { autoAlpha: 0, scale: 0.95 },
              { autoAlpha: 1, scale: 1, duration: 0.2, ease: 'power2.out', onComplete: () => input.focus() }
            );
          });
          mm.add('(prefers-reduced-motion: reduce)', () => {
            gsap.set(backdrop, { autoAlpha: 1 });
            gsap.set(palette, { autoAlpha: 1, scale: 1 });
            input.focus();
          });
        });
      }

      function closePalette() {
        ctx.add(() => {
          const mm = gsap.matchMedia();
          mm.add('(prefers-reduced-motion: no-preference)', () => {
            gsap.to(palette, {
              autoAlpha: 0,
              scale: 0.95,
              duration: 0.15,
              ease: 'power2.in',
              onComplete: () => {
                gsap.set(backdrop, { autoAlpha: 0 });
                trigger.focus();
              }
            });
          });
          mm.add('(prefers-reduced-motion: reduce)', () => {
            gsap.set(backdrop, { autoAlpha: 0 });
            gsap.set(palette, { autoAlpha: 0 });
            trigger.focus();
          });
        });
      }

      trigger.addEventListener('click', openPalette);

      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closePalette();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && gsap.getProperty(backdrop, 'autoAlpha') === 1) {
          closePalette();
        }
        if (e.key === 'k' && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          if (gsap.getProperty(backdrop, 'autoAlpha') === 0) {
            openPalette();
          } else {
            closePalette();
          }
        }
      });
    });
  </script>
</body>
</html>
